version: '3.8'

services:
  web:
    build: ./web
    container_name: servidor_web
    ports:
      - "80:8080"
    volumes:
      - web_content:/var/www/localhost/htdocs/
    networks:
      - infra_red
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'

  db:
    image: postgres:15-alpine
    container_name: servidor_bd
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: practica10_db
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - infra_red
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'

  ftp:
    image: delfer/alpine-ftp-server
    container_name: servidor_ftp
    environment:
      USERS: "kami|Sistemas.2026!"
    ports:
      - "21:21"
      - "21000-21010:21000-21010"
    volumes:
      - web_content:/ftp/kami
    networks:
      - infra_red
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

networks:
  infra_red:
    external: true

volumes:
  db_data:
    external: true
  web_content:
    external: true